# Builds the image and publishes it to the GitHub Container Registry.
#
# Triggers ONLY on a tag starting with "v" (e.g. v1.0.0), or manually from the
# Actions tab. Commits without a tag do not touch the published image: you can
# work in peace without servers offering you half-finished updates.
#
# NO secret needs configuring: GITHUB_TOKEN is generated by GitHub on every
# run, is valid only for this repository and expires with the run.
#
# After the first push the package is created PRIVATE. Make it public once,
# under Profile -> Packages -> codifier-mcp -> Package settings, and link it to
# the repository while you are there. Until you do, the server pulling it will
# get a 403 that reads like a typo in the image name.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    # The suites need no network, no FastMCP and no Docker, which is exactly why
    # they can run here: a tag that does not pass them never becomes an image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install cryptography
      # The common engine, from the SAME pin the image will use — one number,
      # one place. --no-deps on purpose: the suites need no FastMCP, which is
      # exactly why they can run here in under a minute.
      - run: pip install --no-deps -r requirements.txt
      # test_schema and test_registry go round the engine on purpose — one
      # writes with raw SQL, the other with real files on disk — and they were
      # NOT listed here when they were written. A suite the CI does not run is
      # a suite that is green because nobody asked: it stops being a guarantee
      # the first time somebody breaks it in a hurry.
      - run: python3 test_schema.py
      - run: python3 test_registry.py
      - run: python3 test_collaudo.py
      - run: python3 test_surface.py
      - run: python3 test_crash.py

      # This repository paid for it in v1.0.2: the tag said one thing and the
      # constant another, so the service came up, answered, and reported the
      # previous version. Nothing was broken — but the single line a deployment
      # is verified by was a lie, which is worse than a fault that announces
      # itself. The twin wrote this step because of us, and it took until v1.2
      # to come back here. From v1.2 the line matters more: it is what the Log
      # Level field points at as the proof that an update actually took.
      #
      # VERSION lives in rules.py, not in server.py as it does in the twin: the
      # engine is what the suites import, and the server is what imports the
      # engine.
      #
      # Only on a tag: workflow_dispatch has no version to compare against.
      - name: the version constant matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(python3 -c "import re,pathlib; print(re.search(r'^VERSION = \"([^\"]+)\"', pathlib.Path('rules.py').read_text(), re.M).group(1))")
          echo "tag: $tag — rules.py: $code"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag $tag but rules.py says $code — bump VERSION before tagging"
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # the only permission needed
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Built for amd64 only, which is what the server is. Never build this
          # by hand on Apple Silicon: it would come out arm64 and fail to start
          # with a message about the exec format, which reads like a corrupt
          # image rather than the wrong architecture.
          # platforms: linux/amd64,linux/arm64
